<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nearby Rooms (5km - All Pages)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body { margin: 0; font-family: Arial; }
    #map { height: 100vh; }
    .popup { font-size: 14px; }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 1000;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div id="status">Loading...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const CENTER = { lat: 12.9499095, lon: 77.5925484 };
const MAX_DISTANCE = 5; // km
const MAX_PAGES = 25; // safety limit

const map = L.map('map').setView([CENTER.lat, CENTER.lon], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

L.marker([CENTER.lat, CENTER.lon])
  .addTo(map)
  .bindPopup("Center Location")
  .openPopup();

function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) *
            Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

const seenIds = new Set();
let totalShown = 0;

async function fetchPage(page) {
  const url = `https://api.olx.in/relevance/v4/search?category=1723&location=4058803&size=40&page=${page}&sorting=asc-price&lang=en-IN`;

  const res = await fetch(url);
  const data = await res.json();
  return data?.data || [];
}

async function fetchAllRooms() {
  const status = document.getElementById('status');

  for (let page = 1; page <= MAX_PAGES; page++) {
    status.innerText = `Fetching page ${page}...`;

    try {
      const listings = await fetchPage(page);

      if (!listings.length) break;

      let newItems = 0;

      listings.forEach(item => {
        const id = item.id;
        if (seenIds.has(id)) return;
        seenIds.add(id);

        const lat = item?.locations?.[0]?.lat;
        const lon = item?.locations?.[0]?.lon;

        if (!lat || !lon) return;

        const distance = getDistance(CENTER.lat, CENTER.lon, lat, lon);

        if (distance <= MAX_DISTANCE) {
          newItems++;
          totalShown++;

          L.marker([lat, lon])
            .addTo(map)
            .bindPopup(`
              <div class="popup">
                <b>${item.title}</b><br/>
                Price: ₹${item.price?.value || 'N/A'}<br/>
                Distance: ${distance.toFixed(2)} km
              </div>
            `);
        }
      });

      if (newItems === 0) {
        console.log(`Page ${page}: no nearby results`);
      }

      await new Promise(r => setTimeout(r, 300)); // avoid rate limit

    } catch (err) {
      console.error("Error on page", page, err);
      break;
    }
  }

  status.innerText = `Done ✅ Showing ${totalShown} rooms within 5km`;
}

fetchAllRooms();
</script>

</body>
</html>
